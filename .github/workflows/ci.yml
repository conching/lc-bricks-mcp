name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --no-check-publish --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - name: PHP lint
        run: find . -name '*.php' -type f -not -path './vendor/*' -not -path './dist/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - run: php bin/check-tool-parity.php
      - name: Standalone unit tests
        run: for test in tests/Unit/*Test.php; do php "$test"; done
      - run: bash -n bin/build-zip.sh
